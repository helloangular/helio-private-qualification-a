# BlueMatrix follow-up fixture (fx stream, 14 Oct 2026): a Helio-managed (segmented) release workflow.
#
# Every job runs only when Helio dispatches that job by its stage id (helio_stage_id), so Helio runs
# test and production as two separate GitHub runs and can put its own controls (approval gates,
# attestation) between them. production records one GitHub deployment carrying the managed evidence
# contract (task helio-forward-release, rollback_workflow_id). No application is deployed.
#
# Behaviour switches are repository variables, so a fault never needs a new commit (and a new
# helio/workflow/<sha> tag): BM_FX_HM_TEST_SLEEP (seconds, default 40), BM_FX_HM_TEST_MODE
# (fail = the test job fails after its sleep; timeout = it sleeps past its 1-minute timeout).
name: bm-fx-hm
run-name: ${{ inputs.helio_execution_id }}

on:
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      helio_stage_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: bm-fx-hm-${{ inputs.helio_execution_id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ always() && inputs.helio_stage_id == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.BM_FX_HM_TEST_MODE == 'timeout' && 1 || 10 }}
    environment: bm-fx-hm-test
    steps:
      - name: Synthetic test work
        shell: bash
        env:
          MODE: ${{ vars.BM_FX_HM_TEST_MODE }}
          SLEEP_SECONDS: ${{ vars.BM_FX_HM_TEST_SLEEP || '40' }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "timeout" ]; then sleep 150; fi
          sleep "$SLEEP_SECONDS"
          if [ "$MODE" = "fail" ]; then echo "BM_FX_HM_TEST_MODE=fail: synthetic test failure"; exit 1; fi
          echo "synthetic tests passed"

  production:
    needs: test
    if: ${{ always() && inputs.helio_stage_id == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bm-fx-hm-production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: bm-fx-hm-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sleep 10
          python3 - <<'PY'
          import hashlib, json, os, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          revision = os.environ["WORKFLOW_REVISION"] or os.environ["GITHUB_SHA"]
          assert revision == os.environ["GITHUB_SHA"], "workflow_revision must equal the executing commit"
          body = json.dumps({"application": "bm-fx-hm", "version": os.environ["RELEASE_VERSION"],
                             "commit": os.environ["GITHUB_SHA"]}, sort_keys=True).encode()
          digest = "sha256:" + hashlib.sha256(body).hexdigest()
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"],
                     "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest,
                     "artifact_uri": "urn:bm-fx-hm@" + digest,
                     "rollback_workflow_id": ".github/workflows/bm-fx-hm.yml", "workflow_revision": revision}
          json.dump({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [],
                     "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release",
                     "payload": payload}, open("deployment-evidence.json", "w"))
          print("deploying", digest)
          PY
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          deployment_id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments" --data @deployment-evidence.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments/$deployment_id/statuses" --data '{"state":"success","description":"Synthetic deployment evidence; no application deployed"}' > /dev/null
